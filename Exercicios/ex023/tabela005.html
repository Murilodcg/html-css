<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colgroup</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            text-align: center;
        }

        caption{
            background-color: rgb(39, 39, 39);
            color: white;
            text-decoration: underline;
            padding: 10px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        col.cnome{
            background-color: blue;
        }

        col.cidade{
            background-color: aqua;
        }

        col.csexo{
            background-color: blueviolet;
        }

    </style>
</head>
<body>
    
    <table>

        <colgroup>
            <col class="cnome">
            <col class="cidade" span="2">         
            <col class="csexo">
        </colgroup>

        <caption>Dados</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Profição</th>
                <th>Sexo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Carlos</td>
                <td>35</td>
                <td>Autonomo</td>
                <td>Masculino</td>
            </tr>

            <tr>
                <td>Manoel</td>
                <td>26</td>
                <td>Gerente</td>
                <td>Masculino</td>
            </tr>

            <tr>
                <td>Robert</td>
                <td>48</td>
                <td>Adivogado</td>
                <td>Masculino</td>
            </tr>

            <tr>
                <td>Paulo</td>
                <td>42</td>
                <td>Médico</td>
                <td>Masculino</td>
            </tr>
            <tr>
                <td>Larissa</td>
                <td>20</td>
                <td>Vendedora</td>
                <td>Feminino</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
